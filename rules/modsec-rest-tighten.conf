# Optional extra URI/query rules. Most overlap is now in rules/modsec-example.conf (1020–1022);
# include this file only if you want these patterns evaluated twice or use it without example.conf.
SecRuleEngine On
SecRequestBodyAccess On

SecRule REQUEST_URI|REQUEST_LINE "@rx (?i)(%27|'|\")(\s|\+|%20)*(or|and)(\s|\+|%20)+\d" \
    "id:11001,phase:1,deny,status:400,msg:'SQLi pattern in URI'"

SecRule ARGS|REQUEST_URI "@rx (?i)(\|\||%7C%7C)(\s|\+|%20)*(curl|wget|bash|sh|nc\\b|powershell)" \
    "id:11002,phase:1,deny,status:400,msg:'Command injection pattern'"

SecRule REQUEST_URI "@rx (?i)(\.\./|%2e%2e/|%2e%2e%2f|%252e%252e/)" \
    "id:11003,phase:1,deny,status:400,msg:'Path traversal in URI'"
