# =============================================================================
# modsec-graphql.conf — GraphQL-specific defense-in-depth (ModSecurity layer)
# =============================================================================
# These rules intentionally duplicate detections that the dedicated GraphQL security layer
# already performs in Rust (--graphql-security / --block-introspection / --block-graphql-batch /
# --graphql-max-*), matching this proxy's existing "OR together multiple independent detectors"
# architecture (see handle_request in src/proxy.rs). They exist as a second, coarser layer in
# case graphql-security is disabled, misconfigured, or a request reaches ModSecurity via a path
# the Rust layer doesn't cover -- they are NOT a replacement for --graphql-security, which has
# access to the parsed query AST (depth/alias/directive/cost limits) that these regex-only rules
# cannot approximate.
#
# Load alongside modsec-example.conf:
#   cargo run -- ... --modsec-rules rules/modsec-example.conf \
#                  --modsec-rules rules/modsec-graphql.conf

SecRuleEngine On
SecRequestBodyAccess On

# Introspection: `__schema`/`__type` appearing in the request body. Coarser than the Rust
# byte-boundary scanner in src/graphql_security.rs (no false-positive guard for identifiers that
# merely end in these tokens, e.g. `custom__type`) -- expect more false positives here than from
# --block-introspection, by design (this is a blunt second layer, not the primary detector).
SecRule REQUEST_BODY "@rx __schema" \
    "id:13001,phase:2,deny,status:403,msg:'GraphQL introspection (__schema) in body'"
SecRule REQUEST_BODY "@rx __type\\b" \
    "id:13002,phase:2,deny,status:403,msg:'GraphQL introspection (__type) in body'"

# Batched requests: a JSON array as the top-level request body value on the GraphQL endpoint.
# Mirrors --block-graphql-batch's "array of operations" detection.
SecRule REQUEST_URI "@contains graphql" \
    "chain,id:13010,phase:2,deny,status:403,msg:'GraphQL batched request (JSON array body)'"
    SecRule REQUEST_BODY "@rx ^\\s*\\["

# GraphQL-over-GET: a `query=` parameter on a GET request to the GraphQL endpoint. Mirrors
# the default `--graphql-allow-get=false` behavior.
SecRule REQUEST_URI "@contains graphql" \
    "chain,id:13020,phase:1,deny,status:403,msg:'GraphQL query via GET'"
    SecRule REQUEST_METHOD "@streq GET"
    SecRule ARGS_GET:query "@rx ."

# Aliasing/directive-repetition amplification: the same field name repeated an excessive number
# of times as distinct aliases in one document is a common batching/DoS pattern even before
# considering depth or cost. This is a blunt count-based heuristic, not a real parse of the
# selection set (which --graphql-max-aliases performs precisely).
SecRule REQUEST_BODY "@rx (?:[A-Za-z_][A-Za-z0-9_]*\\s*:\\s*[A-Za-z_][A-Za-z0-9_]*\\s*\\([^)]*\\)\\s*\\{){50,}" \
    "id:13030,phase:2,deny,status:403,msg:'Excessive aliased field repetitions in GraphQL body'"
