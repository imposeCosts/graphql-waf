SecRuleEngine On
SecRequestBodyAccess On

# Basic demo rules (not a substitute for OWASP CRS)
SecRule REQUEST_URI "@contains /admin" "id:1001,phase:1,deny,status:403,msg:'Blocked admin path'"

# Simple SQLi/XSS detectors (powered by zentinel-modsec's pure-Rust libinjection)
SecRule ARGS "@detectSQLi" "id:1002,phase:2,deny,status:403,msg:'SQLi detected in args'"
SecRule REQUEST_BODY "@detectSQLi" "id:1003,phase:2,deny,status:403,msg:'SQLi detected in body'"
SecRule REQUEST_BODY "@detectXSS" "id:1004,phase:2,deny,status:403,msg:'XSS detected in body'"

