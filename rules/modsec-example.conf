SecRuleEngine On
SecRequestBodyAccess On

# ---------------------------------------------------------------------------
# Stronger demo / lab rules (not OWASP CRS). Expect false positives on rich
# JSON APIs; tune or split into includes for production.
# ---------------------------------------------------------------------------

# Basic path block
SecRule REQUEST_URI "@contains /admin" "id:1001,phase:1,deny,status:403,msg:'Blocked admin path'"

# Libinjection (zentinel-modsec): args, query string, and body
SecRule ARGS "@detectSQLi" "id:1002,phase:2,deny,status:403,msg:'SQLi detected in args'"
SecRule ARGS "@detectXSS" "id:1005,phase:2,deny,status:403,msg:'XSS detected in args'"
SecRule QUERY_STRING "@detectSQLi" "id:1006,phase:1,deny,status:403,msg:'SQLi detected in query string'"
SecRule QUERY_STRING "@detectXSS" "id:1007,phase:1,deny,status:403,msg:'XSS detected in query string'"
SecRule REQUEST_BODY "@detectSQLi" "id:1003,phase:2,deny,status:403,msg:'SQLi detected in body'"
SecRule REQUEST_BODY "@detectXSS" "id:1004,phase:2,deny,status:403,msg:'XSS detected in body'"

# JSON / text body: patterns libinjection often misses when payloads sit inside JSON strings
# (e.g. GoTestWAF owasp-api REST / JSONRequest).
SecRule REQUEST_BODY "@rx (?i)<\\s*script\\b" \
    "id:1010,phase:2,deny,status:403,msg:'XSS script tag in body'"
SecRule REQUEST_BODY "@rx (?i)<\\s*/\\s*script\\s*>" \
    "id:1011,phase:2,deny,status:403,msg:'XSS closing script in body'"
SecRule REQUEST_BODY "@rx (?i)\\bunion\\s+[+/\\s\\-%_]*select\\b" \
    "id:1012,phase:2,deny,status:403,msg:'SQLi union select in body'"
SecRule REQUEST_BODY "@rx (?i)(\\bjavascript\\s*:\\s*)?(alert|confirm|prompt)\\s*\\(" \
    "id:1013,phase:2,deny,status:403,msg:'DOM JS injection in body'"
SecRule REQUEST_BODY "@rx (?i)\\b(alert|confirm)\\.call\\s*\\(|\\balert\\.apply\\s*\\(" \
    "id:1014,phase:2,deny,status:403,msg:'JS call/apply injection in body'"
SecRule REQUEST_BODY "@rx (?i)JSON_DEPTH\\s*\\(" \
    "id:1015,phase:2,deny,status:403,msg:'Suspicious SQL/JSON function in body'"
SecRule REQUEST_BODY "@rx (?i)(;\\s*|\\|\\||&&)\\s*(curl|wget|bash|/bin/sh|cmd\\.exe|powershell)\\b" \
    "id:1016,phase:2,deny,status:403,msg:'Command injection marker in body'"

# URI / line: SQLi, command injection, traversal (REST scanners, encoded probes)
SecRule REQUEST_URI|REQUEST_LINE "@rx (?i)(%27|'|\")(\\s|\\+|%20)*(or|and)(\\s|\\+|%20)+\\d" \
    "id:1020,phase:1,deny,status:403,msg:'SQLi pattern in URI'"
SecRule ARGS|REQUEST_URI "@rx (?i)(\\|\\||%7C%7C)(\\s|\\+|%20)*(curl|wget|bash|sh|nc\\b|powershell)" \
    "id:1021,phase:1,deny,status:403,msg:'Command injection in URI/args'"
SecRule REQUEST_URI "@rx (?i)(\\.\\./|%2e%2e/|%2e%2e%2f|%252e%252e/)" \
    "id:1022,phase:1,deny,status:403,msg:'Path traversal in URI'"
