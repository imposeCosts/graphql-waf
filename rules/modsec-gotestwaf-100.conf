# =============================================================================
# modsec-gotestwaf-100.conf — lab / evaluation only
# =============================================================================
# Goal: raise GoTestWAF blocked rates (esp. owasp, community, REST JSONRequest)
# when combined with rules/modsec-example.conf. Expect MANY false positives on
# real traffic — do not use as a production default.
#
# Load both files (order: example first, then this file):
#   cargo run -- ... --modsec-rules rules/modsec-example.conf \
#                  --modsec-rules rules/modsec-gotestwaf-100.conf
#
# Or from TOML: modsec_rules = ["rules/modsec-example.conf", "rules/modsec-gotestwaf-100.conf"]
# =============================================================================

SecRuleEngine On
SecRequestBodyAccess On

# =============================================================================
# OWASP ModSecurity "recommended" secure defaults (trimmed for portability)
# Source: https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/refs/heads/v3/master/modsecurity.conf-recommended
# =============================================================================
#
# Notes:
# - This keeps the defaults that most directly impact WAF effectiveness for API
#   scanning (body access, JSON parsing, size/depth limits, PCRE DoS guards).
# - Directives that commonly depend on local filesystem paths (audit log paths,
#   tmp/data dirs) are intentionally omitted here.
#

# Enable JSON request body parser for JSON APIs.
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
  "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Maximum request body size we will accept for buffering.
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Maximum parsing depth allowed for JSON objects.
SecRequestBodyJsonDepthLimit 512

# Maximum number of args allowed per request (helps prevent partial parses).
SecArgumentsLimit 1000
SecRule &ARGS "@ge 1000" \
  "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count',severity:2"

# Reject requests where the body could not be parsed.
SecRule REQBODY_ERROR "!@eq 0" \
  "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

# PCRE tuning to reduce RegEx DoS risk.
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

# --- Scanner / tool User-Agents (community-user-agent, etc.) ---
# Header names are lowercased by the engine.
SecRule REQUEST_HEADERS:user-agent \
    "@rx (?i)(sqlmap/|projectdiscovery/nuclei|\\bnuclei\\s+-|openvas|burpcollaborator|interact\\.sh|\\.oast\\.|\\$\\{jndi:|fuzz faster u fool|\\bffuf/|mercuryboard_user_agent|WinRM Client|OpenVAS-VT)" \
    "id:12001,phase:1,deny,status:403,msg:'Scanner or exploit tool User-Agent'"

# --- CRLF / response splitting in path or query (owasp crlf) ---
SecRule REQUEST_URI|QUERY_STRING \
    "@rx (?i)(%0d%0a|%0a%0d|%250a|%250d|%25%30%41|%25%30%44).{0,48}(set-cookie|location:)" \
    "id:12002,phase:1,deny,status:403,msg:'CRLF / header injection pattern in URI'"

SecRule REQUEST_URI|QUERY_STRING \
    "@rx (?i)Set-cookie\\s*:" \
    "id:12003,phase:1,deny,status:403,msg:'Set-Cookie token in URI/query'"

# --- LDAP (owasp ldap-injection) ---
SecRule REQUEST_URI|REQUEST_BODY|QUERY_STRING \
    "@rx (?i)(objectclass\\s*=|\\(uid\\s*=|userpassword\\s*=)" \
    "id:12004,phase:1,deny,status:403,msg:'LDAP injection pattern'"

# --- NoSQL / DB abuse strings (owasp nosql-injection) ---
SecRule REQUEST_URI|REQUEST_BODY|QUERY_STRING \
    "@rx (?i)(\\$where\\s*:|\\$or\\s*:\\s*\\[|db\\.injection\\.insert|information_schema\\.columns|group_concat\\s*\\()" \
    "id:12005,phase:1,deny,status:403,msg:'NoSQL or metadata exfil pattern'"

# --- Path traversal & file pseudo-schemes (owasp path-traversal, community-lfi) ---
SecRule REQUEST_URI|REQUEST_BODY \
    "@rx (?i)(/etc/passwd|\\.\\./\\.\\./etc|file:%2f%2f%2fetc|%c0%ae%c0%ae|%252e%252e%252f)" \
    "id:12006,phase:1,deny,status:403,msg:'Path traversal or file URL pattern'"

# --- Encoded / DOM XSS markers in URI or body (community-xss, owasp xss) ---
SecRule REQUEST_URI|REQUEST_BODY|QUERY_STRING \
    "@rx (?i)(<\\s*(svg|iframe|object|video|details)\\b|</\\s*script|onerror\\s*=|onload\\s*=|onpointer\\w*\\s*=|javascript\\s*:|prompt\\s*\\(|eval\\s*\\(|atob\\s*\\()" \
    "id:12007,phase:1,deny,status:403,msg:'XSS / script gadget pattern'"

SecRule REQUEST_URI|REQUEST_BODY|QUERY_STRING \
    "@rx (?i)(%3c|%253c)(svg|iframe|object|video|script|/script)" \
    "id:12008,phase:1,deny,status:403,msg:'URL-encoded markup XSS'"

# --- Obfuscated SQLi in URI/body (community-sqli, comment tricks) ---
SecRule REQUEST_URI|REQUEST_BODY|QUERY_STRING \
    "@rx (?i)(/\\*\\s*!\\s*\\d*\\s*u?ni|%2[fF]%2[fF].*%2[fF]%2[fF]|%55ni|%53el)" \
    "id:12009,phase:1,deny,status:403,msg:'Obfuscated SQLi / traversal encoding'"

# --- Shell / RCE hints in JSON or path (community-rce) ---
SecRule REQUEST_URI|REQUEST_BODY \
    "@rx (?i)(`\\s*curl\\b|\\$\\(\\s*curl\\b|bash\\s+-c|/bin/sh\\s+-c|%60\\s*curl)" \
    "id:12010,phase:1,deny,status:403,msg:'Shell / curl RCE pattern'"

# --- IMAP / SMTP line injection in path (owasp mail-injection) ---
SecRule REQUEST_URI|QUERY_STRING \
    "@rx (?i)(%0d%0a|\\r\\n).{0,8}(QUIT|RCPT\\s+TO:|FETCH\\s+\\d+|CAPABILITY)" \
    "id:12011,phase:1,deny,status:403,msg:'Mail protocol smuggling in URI'"

# --- Extra JSONRequest coverage: bare attack tokens often embedded as values ---
SecRule REQUEST_BODY \
    "@rx (?i)(<script|</script>|%3cscript|union\\s+select|'-alert\\(|\\\\x3cscript)" \
    "id:12012,phase:2,deny,status:403,msg:'Aggressive REST/JSON attack substring'"
