[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail on RustSec vulnerabilities by default. Configure granular exceptions via `ignore`.
ignore = [
  # failure v0.1.8, pulled in transitively by wirefilter-engine v0.6.1 (latest release,
  # no upgrade path available upstream). The unsoundness only triggers if a downstream
  # crate provides a malicious `__private_get_type_id__` override of the `Fail` trait,
  # which wirefilter-engine does not do. Revisit if wirefilter-engine ever drops `failure`.
  "RUSTSEC-2019-0036",
]
# Whether an unmaintained/unsound advisory should fail the check.
# Values: "all" | "workspace" | "transitive" | "none"
unmaintained = "workspace"
unsound = "all"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
