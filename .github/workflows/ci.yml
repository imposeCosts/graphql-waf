name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: fmt (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (root)
        run: cargo fmt --all -- --check
      - name: cargo fmt (dvga-like-server)
        run: cargo fmt --manifest-path dvga-like-server/Cargo.toml --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (root)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo clippy (dvga-like-server)
        run: cargo clippy --manifest-path dvga-like-server/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (root)
        run: cargo test --all-features
      - name: cargo test (dvga-like-server)
        run: cargo test --manifest-path dvga-like-server/Cargo.toml --all-features

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (root)
        run: cargo build --all-features
      - name: cargo build (dvga-like-server)
        run: cargo build --manifest-path dvga-like-server/Cargo.toml --all-features
