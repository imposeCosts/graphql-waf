name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2

      - name: Derive version (root Cargo.toml)
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); p=next(p for p in m["packages"] if p["name"]=="graphql-waf"); print(p["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries (linux-amd64)
        if: steps.tag.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cargo build --release --all-features
          cargo build --release --all-features --manifest-path dvga-like-server/Cargo.toml

      - name: Build release binaries (linux-arm64)
        if: steps.tag.outputs.exists != 'true'
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl build-essential pkg-config libssl-dev python3
          run: |
            set -euo pipefail
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            rustup toolchain install stable
            rustup default stable
            export CARGO_TARGET_DIR=target-arm64
            cargo build --release --all-features
            cargo build --release --all-features --manifest-path dvga-like-server/Cargo.toml

      - name: Package artifacts
        if: steps.tag.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/graphql-waf "dist/graphql-waf-linux-amd64"
          cp dvga-like-server/target/release/dvga-like-server "dist/dvga-like-server-linux-amd64"
          cp target-arm64/release/graphql-waf "dist/graphql-waf-linux-arm64"
          cp target-arm64/release/dvga-like-server "dist/dvga-like-server-linux-arm64"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create and push git tag
        if: steps.tag.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/graphql-waf-linux-amd64
            dist/graphql-waf-linux-arm64
            dist/dvga-like-server-linux-amd64
            dist/dvga-like-server-linux-arm64
            dist/SHA256SUMS.txt
